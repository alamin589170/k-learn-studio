name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.klearn --project-name k_learn_studio .
      - run: git checkout -- lib pubspec.yaml
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze') || t.name == 'lintRelease') {
                t.enabled = false
              }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "ERROR: KEYSTORE_B64 or KS_PASS secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > klearn.jks
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk K-Learn-Studio.apk
          $APKSIGNER sign --ks klearn.jks --ks-key-alias klearn --ks-pass env:KS_PASS --key-pass env:KS_PASS K-Learn-Studio.apk
          $APKSIGNER verify --print-certs K-Learn-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: K-Learn-Studio-APK
          path: K-Learn-Studio.apk
